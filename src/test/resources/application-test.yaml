spring:
  datasource:
    url: jdbc:h2:mem:echion;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS tsvector AS VARCHAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

storage:
  type: local

jwt:
  secret: dGVzdC1qd3Qtc2VjcmV0LWZvci1lY2hpb24taGVhbHRoLXRlc3RzLTEyMzQ1Njc4OTA

app:
  auth:
    auto-verify-registration: true
  admin:
    password: test-admin-password

encryption:
  key: test-encryption-key-32-bytes-long

email:
  resend:
    api-key: test-key
    api-url: https://example.test/emails

logging:
  level:
    org.springframework.security: INFO
