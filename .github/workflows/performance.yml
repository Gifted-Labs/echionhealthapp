name: Performance

# Deliberately NOT part of the merge gate.
#
# These tests assert absolute latency (UR-076 <2s, UR-077 <1s, UR-078 concurrency), which is
# only meaningful when the machine is not doing anything else. Running them alongside the rest
# of the suite makes them measure contention instead of the code: an assertion that passes at
# 13ms standalone was observed at 2126ms during a full `verify` on a developer machine.
#
# So they run here, alone, on a schedule and on demand. A regression shows up as a failed
# scheduled run rather than as a flaky pull request.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
  pull_request:
    # Still gate on performance when the query or the caching layer itself changes.
    paths:
      - 'src/main/java/**/repository/**'
      - 'src/main/java/**/service/TemplateService.java'
      - 'src/main/java/**/config/CacheConfig.java'
      - 'src/main/resources/db/migration/**'

permissions:
  contents: read

jobs:
  performance:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # -DexcludedGroups= clears the pom's default exclusion; -Dgroups=performance then
      # selects only the tagged tests, so nothing else competes for CPU or the database.
      - name: Run performance benchmarks
        run: ./mvnw -B -ntp verify -DexcludedGroups= -Dgroups=performance

      - name: Publish measurements
        if: always()
        run: |
          echo "### Performance run" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed -n '/Vault search performance/,/concurrency/p' \
            target/surefire-reports/*VaultSearchPerformancePostgresTest*.txt \
            2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "(no output captured)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GitHub runners are smaller than a developer machine, so absolute numbers will be" >> $GITHUB_STEP_SUMMARY
          echo "slower than the figures in docs/IMPLEMENTATION_AUDIT_2026-07-29.md. Watch the trend." >> $GITHUB_STEP_SUMMARY

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: target/surefire-reports/
          retention-days: 30
